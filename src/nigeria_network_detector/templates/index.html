<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigerian Network Detector</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="flag-mark" aria-hidden="true"><span></span></div>
            <p class="eyebrow">Nigeria, connected</p>
            <h1>Find your network.</h1>
            <p class="subtitle">Enter a Nigerian phone number and we’ll identify its provider.</p>
        </header>

        <main>
            <section class="detector-card" aria-label="Network detector">
                <div class="input-section">
                    <label for="phone-input">Phone number</label>
                    <div class="input-group">
                        <input 
                            type="tel" 
                            id="phone-input" 
                            placeholder="0803 123 4567"
                            autocomplete="tel"
                        >
                        <button id="detect-btn" class="btn-primary">Detect</button>
                    </div>
                    <small class="hint">Supports local and +234 formats</small>
                </div>

                <div id="result-section" class="result-section hidden" role="status" aria-live="polite">
                    <div class="result-card">
                        <div class="network-icon" id="network-icon"></div>
                        <div class="network-info">
                            <h2 id="network-name"></h2>
                            <p id="network-message"></p>
                            <div class="number-details">
                                <span class="label">Number: </span>
                                <span id="cleaned-number"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="playground" aria-hidden="true">
                <div class="players">
                    <div class="player player-one"><i></i><b></b><em></em></div>
                    <div class="player player-two"><i></i><b></b><em></em></div>
                    <div class="player player-three"><i></i><b></b><em></em></div>
                    <span class="ball"></span>
                </div>
            </div>
        </main>

        <footer>
            <p>Made for keeping Nigeria connected</p>
        </footer>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
