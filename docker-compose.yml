# Docker Compose configuration for Nigerian Network Detector
# Starts backend, frontend, PostgreSQL, and Nginx reverse proxy
# Usage: docker compose up --build

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nigerian-detector-postgres
    environment:
      POSTGRES_USER: detector_user
      POSTGRES_PASSWORD: detector_pass
      POSTGRES_DB: nigerian_detector
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detector_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - detector_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nigerian-detector-backend
    environment:
      DATABASE_URL: postgresql://detector_user:detector_pass@postgres:5432/nigerian_detector
      ENVIRONMENT: development
      DEBUG: "false"
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.seed_data && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - detector_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nigerian-detector-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_APP_TITLE: Nigerian Network Detector
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - detector_network
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nigerian-detector-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - detector_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  detector_network:
    driver: bridge
