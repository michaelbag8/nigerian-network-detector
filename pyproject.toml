[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nigeria-network-detector"
version = "0.1.0"
description = "Detects the original Nigerian mobile network allocated to a phone number's prefix."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.5",
]

[tool.vercel]
entrypoint = "src.nigeria_network_detector.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
nigeria-network-detector = "nigeria_network_detector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nigeria_network_detector"]
