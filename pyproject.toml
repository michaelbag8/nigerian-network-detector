[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nigeria-network-detector"
version = "1.0.0"
description = "A FastAPI web app that detects Nigerian mobile network providers from a phone number"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
keywords = ["fastapi", "nigeria", "phone-number", "mno", "network-detector"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
nigeria-network-detector = "nigeria_network_detector.__main__:main"

[project.urls]
Repository = "https://github.com/your-username/nigerian-network-detector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nigeria_network_detector = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/nigeria_network_detector"]
